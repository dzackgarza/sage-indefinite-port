# polyhedral_common-capabilities.toml
# Generated from upstream audit of polyhedral_common/src_indefinite/ and Indefinite.jl
# Phase 01: Capability Inventory

[[function]]
name = "INDEF_FORM_TestEquivalence"
upstream_source = "src_indefinite/INDEF_FORM_TestEquivalence.cpp"
julia_wrapper = "Indefinite.jl: INDEF_FORM_TestEquivalence"
gap_function = "INDEF_FORM_TestEquivalence"
description = "Test if two indefinite integral quadratic forms are equivalent under GL(n, Z). Returns the equivalence matrix if equivalent, empty matrix if not."
input = [
  {name = "Qmat1", type = "QQMatrix", description = "First Gram matrix (symmetric, integral, indefinite)"},
  {name = "Qmat2", type = "QQMatrix", description = "Second Gram matrix (symmetric, integral, indefinite)"},
]
output = {type = "QQMatrix", description = "Equivalence matrix P such that P * Qmat1 * P^T = Qmat2, or 0x0 matrix if not equivalent"}
cli_binary = "INDEF_FORM_TestEquivalence"
cli_input_format = "file: Qmat1 matrix then Qmat2 matrix (space-separated rational entries, first line: nrows ncols)"
cli_output_format = "file: equivalence matrix or empty"
temp_files = true
notes = "Core isometry decision. Delegates to C++ via GAP."

[[function]]
name = "INDEF_FORM_AutomorphismGroup"
