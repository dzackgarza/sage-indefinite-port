[project]
name = "sage-indefinite-port"
version = "0.1.0"
description = "Port of indefinite lattices and orthogonal groups to SageMath."
requires-python = ">=3.14"
dependencies = [
    "sage-extensions @ git+https://github.com/dzackgarza/sage-extensions@16c798dbea898555a1373686bec1bb893edb973a",
    "PyNormaliz",
    "pycddlib>=3.0.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.sage-mypy-category-plugin]
packages = ["sage_extensions"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "hypothesis>=6.165,<7",
    "mypy>=2",
    "pytest>=9.1,<10",
    "pyyaml>=6",
    "ruff>=0.16.5,<1",
    "sage-stubs @ git+https://github.com/dzackgarza/sage-stubs.git@main",
]

[tool.pytest.ini_options]
# `slow` marks work that exercises the costly non-integral correction branch of `pointed_isometry` (about a
# minute per transport). Nothing is excluded by default; a rapid iteration can deselect with `-m "not slow"`.
markers = [
    "slow: exercises the costly non-principal branch of pointed_isometry; deselect with -m 'not slow'",
]
