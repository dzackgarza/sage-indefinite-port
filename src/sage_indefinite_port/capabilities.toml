[[wrapper]]
id = "INDEF_FORM_TestEquivalence"
binary = "INDEF_FORM_TestEquivalence"
source = "src_indefinite/INDEF_FORM_TestEquivalence.cpp"
language = "C++"
description = "Test whether two indefinite integral quadratic forms are equivalent under GL(n, Z). If equivalent, return the equivalence matrix."
inputs = [
    {name = "Qmat1", type = "integer_matrix", description = "First Gram matrix (n x n, symmetric, indefinite)"},
    {name = "Qmat2", type = "integer_matrix", description = "Second Gram matrix (n x n, symmetric, indefinite)"},
]
outputs = [
    {name = "equivalence", type = "integer_matrix", description = "Matrix P in GL(n,Z) such that P Q1 P^T = Q2, or empty if not equivalent"},
]
flags = []
semantics = "Decides isometry of two indefinite integral forms. Returns the transporting matrix when equivalent, empty matrix when not."
notes = "Called from GAP via INDEF_FORM_TestEquivalence gap function. Julia wrapper: Indefinite.INDEF_FORM_TestEquivalence"

[[wrapper]]
id = "INDEF_FORM_AutomorphismGroup"
binary = "INDEF_FORM_AutomorphismGroup"
source = "src_indefinite/INDEF_FORM_AutomorphismGroup.cpp"
language = "C++"
description = "Compute a generating set for the automorphism group (orthogonal group) of an indefinite integral quadratic form."
inputs = [
    {name = "Qmat", type = "integer_matrix", description = "Gram matrix (n x n, symmetric, indefinite)"},
]
outputs = [
    {name = "generators", type = "list_of_integer_matrices", description = "List of generator matrices for Aut(Q) = {P in GL(n,Z) : P Q P^T = Q}"},
]
flags = []
semantics = "Returns a generating set (not necessarily minimal) for the full integral orthogonal group of an indefinite form."
notes = "Core algorithm in CombinedAlgorithms.h. Uses approximate models + stabilizer recursion for rank >= 3."

[[wrapper]]
id = "INDEF_FORM_GetOrbitRepresentative"
binary = "INDEF_FORM_GetOrbitRepresentative"
source = "src_indefinite/INDEF_FORM_GetOrbitRepresentative.cpp"
language = "C++"
description = "Find orbit representatives of vectors v satisfying Q[v] = C under the action of the automorphism group."
inputs = [
    {name = "Qmat", type = "integer_matrix", description = "Gram matrix (n x n, symmetric, indefinite)"},
    {name = "C", type = "integer", description = "Target value. When C=0, computes primitive isotropic vector orbit reps."},
]
outputs = [
    {name = "representatives", type = "list_of_integer_vectors", description = "Orbit representatives of vectors v with Q[v] = C"},
]
flags = []
semantics = "For C=0: primitive isotropic vector orbits. For nonzero C: vectors of norm C up to automorphism."
notes = "Called from GAP. Used for cusp enumeration in modular forms context."

[[wrapper]]
id = "INDEF_FORM_GetOrbit_IsotropicKplane"
binary = "INDEF_FORM_GetOrbit_IsotropicKplane"
source = "src_indefinite/INDEF_FORM_GetOrbit_IsotropicKplane.cpp"
language = "C++"
description = "Find orbit representatives of k-dimensional totally isotropic subspaces under the automorphism group."
inputs = [
    {name = "Qmat", type = "integer_matrix", description = "Gram matrix (n x n, symmetric, indefinite)"},
    {name = "k", type = "integer", description = "Dimension of isotropic subspaces (must have k <= min(p,q) where (p,q) is signature)"},
]
outputs = [
    {name = "representatives", type = "list_of_integer_matrices", description = "Orbit representatives, each a k x n matrix whose rows span an isotropic k-plane"},
]
flags = []
semantics = "Enumerates orbits of maximal/intermediate isotropic subspaces. Key for K3/Enriques surface moduli."
notes = "Uses parabolic recursion through CombinedAlgorithms.h INDEF_FORM_Rec_IsotropicKplane"

[[wrapper]]
id = "INDEF_FORM_GetOrbit_IsotropicKflag"
binary = "INDEF_FORM_GetOrbit_IsotropicKflag"
source = "src_indefinite/INDEF_FORM_GetOrbit_IsotropicKflag.cpp"
language = "C++"
description = "Find orbit representatives of isotropic k-flags (chains of isotropic subspaces 0 < V1 < V2 < ... < Vk) under the automorphism group."
inputs = [
    {name = "Qmat", type = "integer_matrix", description = "Gram matrix (n x n, symmetric, indefinite)"},
    {name = "k", type = "integer", description = "Length of the flag"},
]
outputs = [
    {name = "representatives", type = "list_of_flag_data", description = "Orbit representatives of isotropic flags of length k"},
]
flags = []
semantics = "Generalizes isotropic k-planes to full flag chains. Uses SeqDims decomposition."
notes = "Used for computing moduli of polarised Enriques surfaces."

[[wrapper]]
id = "IndefiniteReduction"
binary = "IndefiniteReduction"
source = "src_indefinite/ (shared infrastructure)"
language = "C++"
description = "Compute a reduced form of an indefinite matrix. Fast but not canonical — reduces coefficient size."
inputs = [
    {name = "GramMat", type = "integer_matrix", description = "Gram matrix (n x n, symmetric, indefinite)"},
]
outputs = [
    {name = "B", type = "integer_matrix", description = "Change-of-basis matrix"},
    {name = "Mred", type = "integer_matrix", description = "Reduced form B Q B^T"},
]
flags = []
semantics = "Fast reduction (not canonical). Produces smaller coefficients for downstream algorithms."
notes = "Called from Julia as IndefiniteReduction. Foundation for all other algorithms."

