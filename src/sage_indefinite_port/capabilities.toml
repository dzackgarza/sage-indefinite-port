[[dependency]]
id = "GAP"
type = "CAS"
description = "Groups, Algorithms, Programming — GAP4 with grape package"
used_by = ["Julia wrappers", "polyhedral_common GAP interface"]
notes = "GAP loads indef/init.g which defines the high-level functions calling C++ binaries."

[[dependency]]
id = "polyhedral_jll"
type = "JLL package"
description = "Julia binary wrapper for polyhedral_common C++ executables"
used_by = ["Indefinite.jl __init__"]
notes = "Provides BinaryWrappers for all C++ binaries. PATH manipulation in __init__."

[[dependency]]
id = "Nemo/Hecke"
type = "Julia library"
description = "Exact linear algebra over number fields and ZZ"
used_by = ["Indefinite.jl"]
notes = "QQMatrix type used for all matrix operations."

# =============================================================================
# File I/O Protocol
# =============================================================================

[[protocol]]
id = "matrix_io"
format = "text"
description = "Space-separated matrix format used by C++ binaries"
spec = """
First line: n_rows n_cols
Subsequent lines: space-separated rational entries (integer or p/q)
Entries on each line preceded by a single space.
"""
examples = [
    "3 3\n 1 0 0\n 0 -1 0\n 0 0 -1",
]

[[protocol]]
id = "vector_io"
format = "text"
description = "Space-separated vector format"
spec = """
First line: n_cols
Second line: space-separated rational entries preceded by a single space.
"""
examples = [
    "3\n 1 0 -1",
]

[[protocol]]
id = "group_io"
format = "text"
description = "Permutation group format for GAP binary communication"
spec = """
First line: n_elements n_generators
Each generator line: space-separated 0-indexed images of elements 0..n-1
"""
