name: PR QC
# Pre-v1: PR policy review is opt-in. Ordinary implementation publication and
# mathematical acceptance proceed on development branches without PR gates.
on:
  workflow_dispatch: {}
jobs:
  qc-ci:
    uses: dzackgarza/ai-review-ci/.github/workflows/_qc.yml@main
    permissions:
      contents: read
      issues: read
    with:
      tier: test-ci
      profile: 'sage'
      infra_ref: 'main'
  deterministic-diff:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    with:
      gate: deterministic-diff
      profile: 'sage'
  delegation-conformance:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    with:
      gate: delegation-conformance
      profile: 'sage'
  qc-doctor:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      # Label-alignment check reads live labels via `gh label list`
      # (GET /repos/{owner}/{repo}/labels), which requires Issues (read).
      issues: read
      pull-requests: read
    with:
      gate: qc-doctor
      profile: 'sage'
  pr-description-checklist:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: read
    with:
      gate: pr-description-checklist
      profile: 'sage'
  thread-resolution:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: read
    with:
      gate: thread-resolution
      profile: 'sage'
