# Probe runs listed acceptance nodes by manual dispatch, one job per node, with a fixed
# cutoff and no budget table. It measures outcome and duration for the run-time triage in
# references/complexity/triage.md.
name: Probe
on:
  workflow_dispatch:
    inputs:
      nodes:
        description: space-separated pytest node ids; each runs in its own job
        required: true
        type: string
      cutoff:
        description: per-node pytest timeout in seconds
        required: true
        type: string
concurrency:
  # A newer dispatch replaces a queued run but never cancels one in progress.
  group: probe-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PROBE_NODES: ${{ inputs.nodes }}
        run: |
          python3 -c 'import json, os; print("matrix=" + json.dumps({"node": os.environ["PROBE_NODES"].split()}))' >> "$GITHUB_OUTPUT"
  julia:
    # Instantiates the bridge environment once into the Julia depot cache that every shard restores.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    env:
      SAGE_BIN: /sage/.venv/bin/sage
      # The image's read-only depot holds Oscar; the cached writable depot
      # in front of it holds the bridge environment's resolved packages.
      JULIA_DEPOT_PATH: "/github/home/.julia:/opt/julia-depot:"
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ github.token }}
      - run: just ci-provision-sage
      - id: key
        run: echo "key=$(just ci-julia-key)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ steps.key.outputs.key }}
      - run: just ci-provision-julia
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ steps.key.outputs.key }}
  probe:
    needs: [plan, julia]
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    # The family's own cap plus setup margin, from the plan step. A single 360 here let a
    # hung family hold the concurrency group for six hours and starve the next run.
    timeout-minutes: 120
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    env:
      SAGE_BIN: /sage/.venv/bin/sage
      # The image's read-only depot holds Oscar; the cached writable depot
      # in front of it holds the bridge environment's resolved packages.
      JULIA_DEPOT_PATH: "/github/home/.julia:/opt/julia-depot:"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ github.token }}
      - run: just ci-provision-sage
      - uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ needs.julia.outputs.key }}
          fail-on-cache-miss: true
      - run: just ci-provision-julia
      - run: just ci-probe '${{ matrix.node }}' '${{ inputs.cutoff }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ strategy.job-index }}
          path: .tmp/ci/probe/
