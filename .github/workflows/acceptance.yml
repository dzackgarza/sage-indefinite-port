# The required acceptance sample runs on every push. Amended long-tail corpora
# are reserved for workflow_dispatch; explicit full-file contracts stay full.
# The summary job collates every executed shard into one failure list.
name: Acceptance
on:
  push: {}
  workflow_dispatch: {}
concurrency:
  # A newer push replaces a queued run but never cancels one in progress.
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # family=shards; the family is tests/acceptance/test_<family>.sage.
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |+
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          # Each family's own bound, in seconds, as the local harness applies it. The job's
          # `timeout-minutes` is derived from it (plus a setup margin), because GitHub's job
          # timeout is the only thing that actually ends a hung container: the recipe's inner
          # `timeout --signal=INT` is 345m and does not escalate by itself.
          caps = {
              "perfect_domains": 2400,
              "reflective": 1800,
              "orthogonal_group": 1800,
              "isometry": 3600,
              "vector_stabilizers": 3400,
              "vector_orbits": 2400,
              "isotropic_orbits": 2400,
              "boundaries": 3400,
              "centralizers": 900,
              "double_cosets": 600,
          }
          # Checkout, Sage provisioning, provider clone, Julia cache restore.
          setup_margin_minutes = 20

          def timeout_minutes(family):
              return -(-caps[family] // 60) + setup_margin_minutes

          shards = {
              "perfect_domains": 8,
              "reflective": 20,
              "orthogonal_group": 4,
              "isometry": 8,
              "vector_stabilizers": 6,
              "vector_orbits": 4,
              "isotropic_orbits": 16,
              "boundaries": 6,
              "centralizers": 1,
              "double_cosets": 1,
          }
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              # #33's amended acceptance nodes run explicit branch samples on
              # push; full files remain available on workflow_dispatch.
              # A sample is partitioned by what binds it, measured per case:
              # `orthogonal_group` is memory-bound and names one selection per
              # shard, `vector_stabilizers` is memory-bound and is ordered by
              # peak so round-robin pairs each heavy case with a light one, and
              # each selected orbit or boundary case has its own shard.
              sampled = {
                  "reflective": (1, None),
                  "orthogonal_group": (6, "orthogonal_group_{shard}"),
                  "vector_stabilizers": (18, None),
                  "vector_orbits": (30, None),
                  "isotropic_orbits": (13, None),
                  "boundaries": (18, None),
              }
              include = [
                  {
                      "family": f,
                      "shard": i,
                      "shards": n,
                      "selection": "",
                      "timeout": timeout_minutes(f),
                  }
                  for f, n in shards.items() if f not in sampled
                  for i in range(n)
              ]
              include.extend(
                  {
                      "family": f,
                      "shard": i,
                      "shards": count,
                      "selection": f if pattern is None else pattern.format(shard=i),
                      "timeout": timeout_minutes(f),
                  }
                  for f, (count, pattern) in sorted(sampled.items())
                  for i in range(count)
              )
          else:
              include = [
                  {
                      "family": f,
                      "shard": i,
                      "shards": n,
                      "selection": "",
                      "timeout": timeout_minutes(f),
                  }
                  for f, n in shards.items() for i in range(n)
              ]
          print("matrix=" + json.dumps({"include": include}))
          PY

  julia:
    # Instantiates the bridge environment once into the Julia depot cache that every shard restores.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    env:
      SAGE_BIN: /sage/.venv/bin/sage
      # The image's read-only depot holds Oscar; the cached writable depot
      # in front of it holds the bridge environment's resolved packages.
      JULIA_DEPOT_PATH: "/github/home/.julia:/opt/julia-depot:"
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ github.token }}
      - run: just ci-provision-sage
      - id: key
        run: echo "key=$(just ci-julia-key)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ steps.key.outputs.key }}
      - run: just ci-provision-julia
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ steps.key.outputs.key }}
  family:
    needs: [plan, julia]
    name: ${{ matrix.family }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    # The family's own cap plus setup margin, from the plan step. A single 360 here let a
    # hung family hold the concurrency group for six hours and starve the next push's run.
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    env:
      SAGE_BIN: /sage/.venv/bin/sage
      # The image's read-only depot holds Oscar; the cached writable depot
      # in front of it holds the bridge environment's resolved packages.
      JULIA_DEPOT_PATH: "/github/home/.julia:/opt/julia-depot:"
    strategy:
      fail-fast: false
      # Keep independent Sage processes below the runner memory-pressure threshold.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ github.token }}
      - run: just ci-provision-sage
      - uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/.julia/packages
            /github/home/.julia/artifacts
            /github/home/.julia/compiled
            /github/home/.julia/registries
            /github/home/.julia/scratchspaces
            /sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env/Manifest.toml
          key: ${{ needs.julia.outputs.key }}
          fail-on-cache-miss: true
      - run: just ci-provision-julia
      - run: just ci-acceptance ${{ matrix.family }} ${{ matrix.shard }} ${{ matrix.shards }} '${{ matrix.selection }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.family }}-${{ matrix.shard }}
          path: .tmp/ci/results/
  summary:
    needs: [plan, family]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-*
          path: results
          merge-multiple: true
      - env:
          ACCEPTANCE_MATRIX: ${{ needs.plan.outputs.matrix }}
          ACCEPTANCE_FAMILY_RESULT: ${{ needs.family.result }}
          ACCEPTANCE_PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -o pipefail
          python3 ci/acceptance_summary.py results "$ACCEPTANCE_MATRIX" "$ACCEPTANCE_FAMILY_RESULT" "$ACCEPTANCE_PLAN_RESULT" | tee -a "$GITHUB_STEP_SUMMARY" acceptance-failures.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-summary
          path: acceptance-failures.md
