# Builds ci/sage.Dockerfile and pushes it to GHCR for the acceptance workflow.
name: Sage image
on:
  push:
    paths:
      - ci/sage.Dockerfile
      - .github/workflows/sage-image.yml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for a Sage build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image=ghcr.io/dzackgarza/sage-indefinite-port-sage
          docker build -f ci/sage.Dockerfile -t "$image:py314" -t "$image:${{ github.sha }}" .
          docker push --all-tags "$image"
